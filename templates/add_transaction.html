<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokaiNoMore - Add Transaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-700 antialiased min-h-screen flex">

    <!-- INCLUDED REUSABLE SIDEBAR -->
    {% include 'sidebar.html' %}

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 p-8 max-w-xl">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Log New Transaction</h2>
        <form action="/add-transaction/{{ student_id }}" method="POST" class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Amount (RM)</label>
                <input type="number" step="0.01" name="amount" required placeholder="15.00" class="w-full border border-slate-200 rounded-xl p-3 focus:outline-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Description</label>
                <input type="text" name="description" placeholder="e.g. Zus Coffee" class="w-full border border-slate-200 rounded-xl p-3 focus:outline-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Category</label>
                <select name="transaction_type" class="w-full border border-slate-200 rounded-xl p-3 focus:outline-emerald-500 bg-white">
                    <option value="Food & Drink">Food & Drink</option>
                    <option value="Public Transport">Public Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Study Materials">Study Materials</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-[#0A3222] hover:bg-[#114630] text-white py-3 rounded-xl font-bold transition">Save Transaction</button>
        </form>
    </main>

</body>
</html>
