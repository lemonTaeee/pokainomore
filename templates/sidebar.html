<!-- templates/sidebar.html -->
<aside class="w-full md:w-64 bg-[#0A3222] text-white flex flex-col justify-between p-4 md:p-6 shrink-0 min-h-0 md:min-h-screen">
    <div>
        <!-- Logo Section -->
        <div class="flex items-center space-x-3 mb-4 md:mb-8">
            <div class="w-9 h-9 md:w-10 md:h-10 bg-emerald-500 rounded-lg flex items-center justify-center font-black text-lg md:text-xl text-white shadow-inner">
                💸
            </div>
            <div>
                <h1 class="text-base md:text-lg font-bold tracking-tight text-white leading-none">PokaiNoMore</h1>
                <p class="text-[10px] text-emerald-300 font-medium">Financial Management System</p>
            </div>
        </div>

        <!-- Navigation Links (Horizontal grid on mobile, vertical list on desktop) -->
        <nav class="grid grid-cols-1 sm:grid-cols-3 md:grid-cols-1 gap-2">
            <a href="/dashboard" 
               class="flex items-center space-x-3 px-3 py-2.5 md:px-4 md:py-3 rounded-xl text-xs md:text-sm transition 
               {% if active_page == 'dashboard' %}bg-[#114630] text-emerald-300 font-semibold{% else %}text-emerald-100 hover:bg-[#114630]/60 font-medium{% endif %}">
                <svg class="w-4 h-4 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span>Dashboard</span>
            </a>

            <a href="/history" 
               class="flex items-center space-x-3 px-3 py-2.5 md:px-4 md:py-3 rounded-xl text-xs md:text-sm transition 
               {% if active_page == 'history' %}bg-[#114630] text-emerald-300 font-semibold{% else %}text-emerald-100 hover:bg-[#114630]/60 font-medium{% endif %}">
                <svg class="w-4 h-4 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <span>History Log</span>
            </a>

            <a href="/add-transaction" 
               class="flex items-center space-x-3 px-3 py-2.5 md:px-4 md:py-3 rounded-xl text-xs md:text-sm transition 
               {% if active_page == 'add_transaction' %}bg-[#114630] text-emerald-300 font-semibold{% else %}text-emerald-100 hover:bg-[#114630]/60 font-medium{% endif %}">
                <svg class="w-4 h-4 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span>Add Transaction</span>
            </a>
        </nav>
    </div>

    <!-- Log Out Link -->
    <div class="mt-4 md:mt-0 pt-2 border-t border-emerald-900/40 md:border-t-0">
        <a href="/logout" class="flex items-center space-x-3 px-3 py-2.5 md:px-4 md:py-3 text-emerald-200/80 hover:text-white text-xs md:text-sm font-medium transition">
            <svg class="w-4 h-4 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            <span>Log Out</span>
        </a>
    </div>
</aside>
